<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>@@CSS@@</style></head>
<body><main>
<header class="appHeader"><div><h1>@@TITLE@@</h1><p class="snapshotCaption" id="snapshotCaption"></p></div><button id="themeBtn" type="button" aria-label="切换深浅主题">深浅色</button></header>
<nav class="pageNav" aria-label="调研导航"><a href="#/start" id="navStart">起点</a><a href="#/coarse" id="navScenes">场景</a><a href="#/objects" id="navObjects">对象</a><a href="#/methods" id="navMethods">方法</a></nav>
<section id="pageStart"><div class="startHead"><h2>研究情况</h2><span class="startMeta" id="observation"></span></div><div class="startFacts"><div class="startObject"><span class="startLabel">研究对象与范围</span><strong id="scopeTitle"></strong><p id="startProgress"></p></div></div><section class="startSources"><div class="startHead"><h2>会议与期刊来源</h2><span class="startMeta" id="sourceCount"></span></div><div id="sourceList" class="startRows"></div></section><details class="startDetails"><summary>阅读范围、覆盖与文件</summary><div class="detailCopy" id="startLimits"></div><div class="startCatalogue" id="coverageTable"></div><p class="downloads" id="downloads"></p></details></section>
<div id="exploreControls" hidden><section class="filterDeck" aria-label="全局筛选"><div class="filterPrimary"><fieldset class="filterGroup" id="filterImplField"><legend>实现路径</legend><div class="chips" id="implChips"></div></fieldset><fieldset class="filterGroup" id="filterTrainField"><legend>训练要求</legend><div class="chips" id="trainChips"></div></fieldset></div><div class="scopeBar"><label>论文范围<select id="filterPool"><option value="all">全部论文</option><option value="core">目标会议期刊</option><option value="preprint">前沿预印本</option></select></label><details class="viewNotes"><summary>分类与统计</summary><div class="detailCopy"><p id="scopeLimitations"></p><p id="countingNote"></p><div id="currentTaxonomy"></div></div></details></div><div class="globalPaperSearch" role="search" id="globalSearchBar"><label class="srOnly" for="search">搜索全部论文</label><input id="search" type="search" aria-label="搜索全部论文" placeholder="搜索全部论文的标题、中文解读或编号"><button id="clearSearch" type="button" hidden>清除</button></div></section></div>
<nav id="crumbs" class="crumbs" aria-label="分类路径" hidden></nav><p id="viewStatus" class="caption" hidden></p>
<section id="pageExplore" hidden><div class="pageHeading"><h2 id="exploreTitle"></h2><a class="contextFlag go" id="viewAllPapers">查看论文</a></div><section class="blk first" id="sectionStock"><div class="sectionHeader"><div class="sectionTitle"><span class="sectionNumber">01</span><h3>存量</h3></div><span class="sectionMeta" id="stockCaption"></span></div><div class="figure"><div class="figurePlot"><div id="stockChart" class="stack"></div></div><div class="legend" id="stockLegend"></div><div class="card"><table id="stockData"></table></div></div><p class="caption" id="referenceNote" hidden></p></section><section class="blk" id="sectionGrowth"><div class="sectionHeader"><div class="sectionTitle"><span class="sectionNumber">02</span><h3>增长</h3></div><span class="sectionMeta" id="growthCaption"></span></div><div class="annualGrowthGrid" id="growthCharts"></div><p class="caption annualFootnote" id="growthNote"></p></section></section>
<section id="pagePapers" hidden><div class="pageHeading"><h2 id="papersTitle">论文</h2><span id="paperCount" class="contextFlag"></span></div><div id="paperFacets" class="paperFacets"></div><p class="caption" id="methodDefinition"></p><div class="analysisEntry" id="analysisEntry" hidden><span id="analysisEntryLabel"></span><a class="go" id="analysisOpen">全文拆解</a></div><label class="paperSearch" id="localPaperSearch"><span class="srOnly">搜索当前分组</span><input id="localSearch" type="search" aria-label="搜索当前分组" placeholder="在当前分组中搜索标题、中文解读或编号"></label><div id="paperList" class="paperList"></div><div class="paperPagination"><button id="previousPage" type="button">上一页</button><span id="paperPage"></span><button id="nextPage" type="button">下一页</button></div></section>
@@READING_HTML@@
</main><script>@@JS@@</script></body></html>
