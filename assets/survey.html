<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>@@CSS@@</style></head>
<body><main>
<header><h1>@@TITLE@@</h1><button id="themeBtn" type="button" aria-label="切换深浅主题">◐</button></header>
<nav class="pageNav" aria-label="调研导航"><a href="#/start" id="navStart">起点</a><a href="#/scenes" id="navScenes">场景</a><a href="#/objects" id="navObjects">对象</a><a href="#/methods" id="navMethods">方法</a></nav>
<section id="pageStart"><p class="eyebrow">研究范围</p><h2 id="scopeTitle"></h2><p class="caption" id="observation"></p><section class="blk first"><h3>目标会议与期刊</h3><div id="sourceList" class="sourceList"></div></section></section>
<div id="exploreControls" hidden><div class="filters"><label id="filterImplField">实现路径<select id="filterImpl"><option value="all">全部</option><option value="software">软件侧</option><option value="hardware">含硬件设计</option></select></label><label id="filterTrainField">训练要求<select id="filterTrain"><option value="all">全部</option><option value="none">无新增训练</option><option value="aux">仅辅助组件</option><option value="target">目标模型</option></select></label><label>论文范围<select id="filterPool"><option value="all">全部</option><option value="core">目标来源</option><option value="preprint">前沿预印本</option></select></label><input id="search" type="search" aria-label="搜索论文" placeholder="搜索标题、摘要或编号"><button id="clearSearch" type="button" hidden>清除</button></div><p class="caption" id="scopeLimitations"></p></div>
<section id="pageExplore" hidden><div class="pageHeading"><h2 id="exploreTitle"></h2><a class="go" id="viewAllPapers">查看论文</a></div><nav id="crumbs" class="crumbs" aria-label="分类路径"></nav><section class="blk first"><h3>存量</h3><div id="stockChart" class="chart"></div><details><summary>数据</summary><div class="analysisResults"><table id="stockData"></table></div></details></section><section class="blk"><h3>增长</h3><div class="trendGrid" id="growthCharts"></div></section></section>
<section id="pagePapers" hidden><div class="pageHeading"><h2 id="papersTitle">论文</h2><span id="paperCount" class="caption"></span></div><div id="paperFacets" class="facets"></div><div class="analysisEntry" id="analysisEntry" hidden><span id="analysisEntryLabel"></span><a class="go" id="analysisOpen">文献拆解</a></div><div id="paperList"></div><div class="pager"><button id="previousPage" type="button">上一页</button><span id="paperPage"></span><button id="nextPage" type="button">下一页</button></div></section>
@@READING_HTML@@
</main><script>@@JS@@</script></body></html>
